<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ficha RPG</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

.dice-popup{
  position:fixed;
  bottom:20px;
  right:20px;

  width:260px;
  padding:14px;

  background:#111827;
  border:2px solid #facc15;
  border-radius:10px;

  box-shadow:0 0 20px rgba(0,0,0,0.6);

  z-index:9999;
}

.dice-popup-header{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:16px;
  margin-bottom:8px;
}

.popup-close{
  cursor:pointer;
}

.popup-close:hover{
  color:#f87171;
}

.dice-popup-body{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#popupDetalhe{
  font-size:13px;
  color:#d1d5db;
}

#popupTotal{
  font-size:26px;
  font-weight:bold;
  color:#facc15;
}
  
body{
  background:#0f172a;
  color:#e5e7eb;
  font-family: Arial, sans-serif;
}

.bloco{
  background:#1f2937;
  padding:18px;
  border-radius:14px;
  margin:18px auto;
  max-width:900px;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h2{
  margin-top:0;
  color:#a5b4fc;
  border-bottom:1px solid #374151;
  padding-bottom:6px;
}

.linha{
  margin:10px 0;
  display:flex;
  flex-direction:column;
}

input, select, textarea{
  border-radius:10px;
  border:1px solid #374151;
  padding:8px;
  background:#020617;
  color:#e5e7eb;
}

.atributo, .pericia, .habilidade{
  display:grid;
  grid-template-columns: 1fr 90px 40px 160px;
  align-items:center;
  gap:10px;
  margin:6px 0;
}

.dice{
  cursor:pointer;
  font-size:22px;
  text-align:center;
}

.dice:hover {
  filter: drop-shadow(0 0 8px #facc15);
  transform: scale(1.2);
  transition: 0.2s;
}

.resultado{
  color:#a5f3fc;
  font-size:13px;
}

.resultado-popup {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background:#1f2937;
  color:#e5e7eb;
  border:1px solid #4ade80;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
  z-index:9999;
  animation: popUp 0.3s ease;
}
.resultado-popup .resultado-header {
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:5px;
}
@keyframes popUp {
  from { transform: translateY(50px); opacity:0; }
  to { transform: translateY(0); opacity:1; }
}

.status-card{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.status-item{
  background:#020617;
  border:1px solid #374151;
  padding:12px;
  border-radius:12px;
}

.status-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

.status-bar{
  height:8px;
  background:#1f2937;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
  cursor:pointer;
}

.status-fill{
  height:8px;
  background:linear-gradient(90deg,#4ade80,#22c55e);
  width:100%;
  transition:.25s;
}

.status-fill.sanity{
  background:linear-gradient(90deg,#60a5fa,#3b82f6);
}

.status-fill.aura{
  background:linear-gradient(90deg,#fde047,#facc15);
}

.alerta{
  margin-top:10px;
  padding:8px 10px;
  border-radius:10px;
  background:#065f46;
  border:1px solid #059669;
  color:#d1fae5;
  display:none;
}
  .status-sub{
  background:#0f172a;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid #374151;
  font-size:14px;
}

.salvar-btn{
  margin-top:10px;
  padding:10px 20px;
  border-radius:10px;
  border:none;
  background:#4f46e5;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="ficha">

<!-- SLOT -->
<div class="bloco">
<h2>Seleção de Ficha</h2>
<div class="linha">
<label>Escolha o slot</label>
<select id="slot">
<option value="1">Slot 1</option>
<option value="2">Slot 2</option>
<option value="3">Slot 3</option>
<option value="4">Slot 4</option>
<option value="5">Slot 5</option>
<option value="6">Slot 6</option> 
<option value="7">Slot 7</option> 
<option value="8">Slot 8</option>
<option value="9">Slot 9</option> 
<option value="10">Slot 10</option> 
</select>
</div>
</div>

<!-- BÁSICO -->
<div class="bloco">
<h2>Informações Básicas</h2>
<div class="linha">
  <label>Imagem do Personagem</label>
  <input type="file" id="imgUpload" accept="image/*" onchange="carregarImagem(event)">
</div>

<div class="linha" style="text-align:center;">
  <img id="previewImg" 
       style="max-width:200px; max-height:200px; border-radius:12px; border:1px solid #374151; display:none;">
</div>
<div class="linha"><label>Nome</label><input id="nome"></div>
<div class="linha"><label>Idade</label><input id="idade" type="number"></div>
<div class="linha"><label>Energia Inata</label><textarea id="antecedencia"></textarea></div>
<div class="linha"><label>Descrição</label><textarea id="descricao"></textarea></div>
<div class="linha"><label>História</label><textarea id="historia"></textarea></div>
</div>

<!-- ATRIBUTOS -->
<div class="bloco">
<h2>Atributos</h2>

<div class="linha">
<label>Nível do Personagem</label>
<select id="nivel" onchange="recalcularVidaSanidade()">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
</select>
</div>

<div id="atributos"></div>
</div>

<!-- PERÍCIAS -->
<div class="bloco">
<h2>Perícias</h2>
<div id="pericias"></div>
</div>

<!-- STATUS -->
<div class="bloco">
<h2>Status</h2>
<div class="status-card">

<div class="status-item">
<div class="status-top"><div>Vida</div><span>❤️</span></div>
<input id="vida" type="number" oninput="atualizarVida()">
<small id="vidaMaxTxt"></small>
<div class="status-bar">
  <div id="vida-bar" class="status-fill"></div>
</div>
</div>

<div class="status-item">
<div class="status-top"><div>Sanidade</div><span>🧠</span></div>
<input id="sanidade" type="number" oninput="atualizarSanidade()">
<small id="sanidadeMaxTxt"></small>
<div class="status-bar">
  <div id="sanidade-bar" class="status-fill sanity"></div>
</div>
</div>

<div class="status-item">
<div class="status-top"><div>Aura ✨</div></div>
<input id="aura" type="number" value="0" oninput="atualizarAura()">
<small id="auraMaxTxt">Máx: 0</small>
<div class="status-bar">
  <div id="aura-bar" class="status-fill aura"></div>
</div>
</div>

<div class="status-item">
  <div class="status-top"><div>Deslocamento (Quadrados)</div></div>
  <input id="deslocamento" type="number" disabled>
</div>

<div class="status-item">
<div class="status-top"><div>Bloqueio 🛡</div></div>

<div style="display:flex; gap:10px; margin-bottom:6px;">
  <div class="status-sub">
    🔹 <strong>Menor:</strong> <span id="bloqueioMenor">0</span>
  </div>
  <div class="status-sub">
    🔸 <strong>Maior:</strong> <span id="bloqueioMaior">0</span>
  </div>
</div>

<div class="linha">
  <label>RD Total</label>
  <input type="number" id="rdTotal" value="0" oninput="atualizarBloqueio()">
</div>
</div>
</div>

<!-- HABILIDADES -->
<div class="bloco">
<h2>Habilidades</h2>
<div id="habilidades"></div>
<button class="salvar-btn" onclick="adicionarHabilidade()">+ Adicionar Habilidade</button>
</div>

<!-- SALVAR / PDF -->
<div class="bloco">
<button class="salvar-btn" onclick="salvarFicha()">Salvar ficha</button>
<div id="alerta" class="alerta">Ficha salva com sucesso!</div>
<button class="salvar-btn" onclick="gerarPDF()">Baixar PDF da ficha</button>
</div>

</div>

<script>

function mostrarPopup(titulo, detalhe, total){

  const popup = document.getElementById("dicePopup");

  document.getElementById("popupTitulo").innerText = titulo;
  document.getElementById("popupDetalhe").innerText = detalhe;
  document.getElementById("popupTotal").innerText = total;

  popup.style.display = "block";
}

function fecharPopup(){
  document.getElementById("dicePopup").style.display = "none";
}
  
/* ================= DADOS ================= */  
const somDado = new Audio("dado.mp3")
  
const atributos = [
{sigla:"FOR", nome:"Força"},
{sigla:"CON", nome:"Constituição"},
{sigla:"AGI", nome:"Agilidade"},
{sigla:"INT", nome:"Intelecto"},
{sigla:"POD", nome:"Poder"}
];

const pericias = [
["FOR","Atletismo"],["FOR","Luta"],
["CON","Fortitude"],
["AGI","Reflexos"],["AGI","Furtividade"],["AGI","Acrobacia"],
["AGI","Iniciativa"],["AGI","Pontaria"],["AGI","Pilotagem"],
["INT","Ciências"],["INT","Tática"],["INT","Investigação"],
["INT","Medicina"],["INT","Tecnologia"],["INT","Sobrevivência"],
["INT","Enganação"],["INT","Diplomacia"],["POD","Intimidação"],
["INT","Artes"],["POD","Intuição"],["INT","Percepção"],
["INT","Adestramento"],["POD","Charme"],["POD","Vontade"],["POD","Energia"]
];

let habilidades = [];
let ultimoTesteFortitude = 0;

/* ================= INTERFACE ================= */
function criarInterface(){
  const aBox = document.getElementById("atributos");
  aBox.innerHTML = "";

  atributos.forEach(a=>{
    aBox.innerHTML += `
    <div class="atributo">
      <div>[${a.sigla}] ${a.nome}</div>
      <select id="atr_${a.sigla}" onchange="recalcularVidaSanidade(); atualizarBloqueio();">
        ${[...Array(21).keys()].map(v=>`<option value="${v}">${v}</option>`).join("")}
      </select>
      <span class="dice" onclick="rolarAtributo('${a.sigla}')">🎲</span>
      <span id="resAtr_${a.sigla}" class="resultado"></span>
    </div>`;
  });

const pBox = document.getElementById("pericias");
pBox.innerHTML = "";
  
pericias.forEach((p,i)=>{
  const id = "per_"+i;

  pBox.innerHTML += `
  <div class="pericia">
    <div>
      <select id="atrKey_${id}">
        ${atributos.map(a=>`<option value="${a.sigla}" ${a.sigla===p[0]?"selected":""}>[${a.sigla}]</option>`).join("")}
      </select>
      ${p[1]}
    </div>

    <select id="${id}">
      ${[...Array(10).keys()].map(v=>`<option value="${v+1}">${v+1}</option>`).join("")}
    </select>

    <input type="number" id="bonus_${id}" value="0" style="width:60px">

    <span class="dice" onclick="rolarPericia('${id}')">🎲</span>
    <span id="res_${id}" class="resultado"></span>
  </div>`;
});
}

/* ================= ROLAGENS ================= */
  
function d20(){

  somDado.currentTime = 0;
  somDado.play();

  return Math.floor(Math.random()*20)+1;

}

function limparDepois(id,ms=8000){
  setTimeout(()=>{
    const el=document.getElementById(id);
    if(el) el.innerText="";
  },ms);
}

function rolarAtributo(sigla){
  
  const v=Number(document.getElementById("atr_"+sigla).value);
  const resId="resAtr_"+sigla;
  const d=d20();
  document.getElementById(resId).innerText=`1d20 (${d}) + ${v} = ${d+v}`;
  const total = d + v;
document.getElementById(resId).innerText =
`1d20 (${d}) + ${v} = ${total}`;

mostrarPopup(
  sigla,
  `1d20 (${d}) + ${v}`,
  total
  );
  
  limparDepois(resId);
}

function rolarPericia(id){
  
  const qtdDados = parseInt(document.getElementById(id).value);
  const sigla = document.getElementById("atrKey_"+id).value;
  const bonus = parseInt(document.getElementById("bonus_"+id).value) || 0;

  const atributoValor = parseInt(
    document.getElementById("atr_"+sigla).value
  ) || 0;

  let resultados = [];
  let maior = 0;

  for(let i = 0; i < qtdDados; i++){
    const roll = d20();
    resultados.push(roll);
    if(roll > maior) maior = roll;
  }

const total = maior + atributoValor + bonus;

const indice = parseInt(id.split("_")[1]);

mostrarPopup(
  pericias[indice][1],
  `${qtdDados}d20 [${resultados.join(", ")}]`,
  total
);

const resId = "res_" + id;

document.getElementById(resId).innerText =
`🎲 ${qtdDados}d20 [${resultados.join(", ")}] → maior: ${maior} + ${atributoValor} + ${bonus} = ${total}`;
  if(pericias[indice][1] === "Fortitude"){
    ultimoTesteFortitude = total;
    atualizarBloqueio();
  }
  
  limparDepois(resId);
}

/* ================= VIDA, SANIDADE & AURA ================= */
function recalcularVidaSanidade(){
  const nivel = Number(document.getElementById("nivel").value) || 1;

  const con = Number(document.getElementById("atr_CON").value) || 0;
  const pod = Number(document.getElementById("atr_POD").value) || 0;
  const intt = Number(document.getElementById("atr_INT").value) || 0;

  const vidaMax = (20 + con * 2) * nivel;

  const sanidadeMax = (20 + intt * 2) * nivel;

  const auraBase = (con + pod) * 3;
  const auraNivel = (con + pod) * (nivel - 1);
  const auraMax = auraBase + auraNivel;

  const vidaInput = document.getElementById("vida");
  const sanidadeInput = document.getElementById("sanidade");
  const auraInput = document.getElementById("aura");

  vidaInput.max = vidaMax;
  sanidadeInput.max = sanidadeMax;
  auraInput.max = auraMax;

  if(!vidaInput.value || vidaInput.value > vidaMax){
    vidaInput.value = vidaMax;
  }

  if(!sanidadeInput.value || sanidadeInput.value > sanidadeMax){
    sanidadeInput.value = sanidadeMax;
  }

  if(!auraInput.value || auraInput.value > auraMax){
    auraInput.value = auraMax;
  }

  document.getElementById("vidaMaxTxt").innerText = "Máx: " + vidaMax;
  document.getElementById("sanidadeMaxTxt").innerText = "Máx: " + sanidadeMax;
  document.getElementById("auraMaxTxt").innerText = "Máx: " + auraMax;
  document.getElementById("deslocamento").value = 5 + Number(document.getElementById("atr_AGI").value || 0);

  atualizarBarra("vida","vida-bar",vidaMax);
  atualizarBarra("sanidade","sanidade-bar",sanidadeMax);
  atualizarAura();
}

function atualizarBarra(inputId,barId,max){
  const v = Number(document.getElementById(inputId).value) || 0;
  document.getElementById(barId).style.width =
    max > 0 ? ((v / max) * 100) + "%" : "0%";
}

function atualizarAura(){
  const auraEl = document.getElementById("aura");
  const max = Number(auraEl.getAttribute("max")) || 0;

  let v = Number(auraEl.value) || 0;

  if(v > max) v = max;
  if(v < 0) v = 0;

  auraEl.value = v;

  document.getElementById("aura-bar").style.width =
    max > 0 ? ((v / max) * 100) + "%" : "0%";
}

  function atualizarVida(){
  const max = Number(document.getElementById("vida").max) || 0;
  let v = Number(document.getElementById("vida").value) || 0;

  if(v > max) v = max;
  if(v < 0) v = 0;

  document.getElementById("vida").value = v;
  atualizarBarra("vida","vida-bar",max);
}

function atualizarSanidade(){
  const max = Number(document.getElementById("sanidade").max) || 0;
  let v = Number(document.getElementById("sanidade").value) || 0;

  if(v > max) v = max;
  if(v < 0) v = 0;

  document.getElementById("sanidade").value = v;
  atualizarBarra("sanidade","sanidade-bar",max);
}

function atualizarBloqueio(){

  const con = parseInt(document.getElementById("atr_CON").value) || 0;
  const rd = parseInt(document.getElementById("rdTotal").value) || 0;

  // Bloqueio menor = CON + RD
  const bloqueioMenor = (2 * con) + rd;

  // Bloqueio maior = último teste Fortitude + (2 × CON) + RD
  const bloqueioMaior = ultimoTesteFortitude + (2 * con) + rd;

  document.getElementById("bloqueioMenor").innerText = bloqueioMenor;
  document.getElementById("bloqueioMaior").innerText = bloqueioMaior;
}
  
/* ================= HABILIDADES ================= */
function adicionarHabilidade(){
  habilidades.push({nome:"",desc:"",dado:""});
  renderHabilidades();
}

function removerHabilidade(i){
  habilidades.splice(i,1);
  renderHabilidades();
}

function renderHabilidades(){
  const box=document.getElementById("habilidades");
  box.innerHTML="";

  habilidades.forEach((h,i)=>{
    box.innerHTML+=`
    <div class="habilidade">
      <input placeholder="Nome" value="${h.nome}" 
        oninput="habilidades[${i}].nome=this.value">
      <input placeholder="Dado (ex: 2d6+3)" value="${h.dado}"
        oninput="habilidades[${i}].dado=this.value">
      <span class="dice" onclick="rolarHabilidade(${i})">🎲</span>
      <span id="resHab_${i}" class="resultado"></span>
      <textarea placeholder="Descrição"
        oninput="habilidades[${i}].desc=this.value">${h.desc}</textarea>
      <button onclick="removerHabilidade(${i})">❌</button>
    </div>`;
  });
}

function rolarHabilidade(i){

  somDado.currentTime = 0;
  somDado.play();
  
  const h = habilidades[i];
  const resId = "resHab_" + i;

  if(!h || !h.dado){
    document.getElementById(resId).innerText = "Insira um dado válido!";
    limparDepois(resId);
    return;
  }

  const regex = /(\d+d\d+!\d+|\d+d\d+!|\d+d\d+|\+|\-|\d+)/gi;
  const tokens = h.dado.match(regex);

  if(!tokens){
    document.getElementById(resId).innerText = "Formato inválido";
    limparDepois(resId);
    return;
  }

  let total = 0;
  let detalhes = [];
  let operador = "+";

  tokens.forEach(tok=>{
    tok = tok.trim();
    if(tok === "+" || tok === "-"){
      operador = tok;
    }
else if(tok.toLowerCase().includes("d")){

  let qtd, faces, explosao = null;

  const dado = tok.toLowerCase();

  if(dado.includes("!")){

    const partes = dado.split("!");
    const base = partes[0];
    const crit = partes[1];

    [qtd, faces] = base.split("d").map(Number);

    explosao = crit ? Number(crit) : faces;

    if(qtd > 100 || faces > 1000){
      document.getElementById(resId).innerText = "Dado muito grande!";
      return;
    }

  }else{

    [qtd, faces] = dado.split("d").map(Number);

  }

  for(let j=0; j<qtd; j++){

    let r = Math.floor(Math.random()*faces)+1;

    detalhes.push(r);

    total = operador === "+" ? total+r : total-r;

    if(explosao){

      let limiteExplosao = 100;
      let cont = 0;
      
      while(r >= explosao && cont < limiteExplosao){
        
        cont++;
        r = Math.floor(Math.random()*faces)+1;

        detalhes.push("💥"+r);

        total = operador === "+" ? total+r : total-r;
        
      }

    }

  }

} else {
      const n = Number(tok);
      total = operador === "+" ? total+n : total-n;
      detalhes.push(tok);
    }
  });

  mostrarPopup(
    h.nome || "Habilidade",
    h.dado + " → [" + detalhes.join(" + ") + "]",
    total
  );

  document.getElementById(resId).innerText = 
    `${h.dado} → [${detalhes.join(" + ")}] = ${total}`;

  limparDepois(resId);
}

/* ================= SALVAR ================= */

function carregarImagem(event){
  const file = event.target.files[0];
  if(!file) return;

  // 🔴 Limite de 1MB
  if(file.size > 1024 * 1024){
    alert("Imagem muito grande! Use uma imagem menor que 1MB.");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    const img = document.getElementById("previewImg");
    img.src = e.target.result;
    img.style.display = "block";
    img.dataset.base64 = e.target.result;
  };
  reader.readAsDataURL(file);
}
  
function salvarFicha(){
  const slot=document.getElementById("slot").value;
  const chave="fichaRPG_"+slot;

  const dados={
    imagem: document.getElementById("previewImg").dataset.base64 || "",
    nome:nome.value,
    idade:idade.value,
    antecedencia:antecedencia.value,
    descricao:descricao.value,
    historia:historia.value,
    nivel:nivel.value,
    vida:vida.value,
    sanidade:sanidade.value,
    aura:aura.value,
    habilidades:habilidades,
    atributos:{},
    pericias:{}
  };

  atributos.forEach(a=>{
    dados.atributos[a.sigla]=document.getElementById("atr_"+a.sigla).value;
  });

  pericias.forEach((p,i)=>{
    dados.pericias["per_"+i]=document.getElementById("per_"+i).value;
  });

  localStorage.setItem(chave,JSON.stringify(dados));

  const alerta=document.getElementById("alerta");
  alerta.style.display="block";
  setTimeout(()=>alerta.style.display="none",2500);
}

function salvarFichaManual(chave){

  const dados={
    imagem: document.getElementById("previewImg").dataset.base64 || "",
    nome:document.getElementById("nome").value,
    idade:document.getElementById("idade").value,
    antecedencia:document.getElementById("antecedencia").value,
    descricao:document.getElementById("descricao").value,
    historia:document.getElementById("historia").value,
    nivel:document.getElementById("nivel").value,
    vida:document.getElementById("vida").value,
    sanidade:document.getElementById("sanidade").value,
    aura:document.getElementById("aura").value,
    habilidades:habilidades,
    atributos:{},
    pericias:{}
  };

  atributos.forEach(a=>{
    dados.atributos[a.sigla]=document.getElementById("atr_"+a.sigla).value;
  });

  pericias.forEach((p,i)=>{
    dados.pericias["per_"+i]=document.getElementById("per_"+i).value;
  });

  localStorage.setItem(chave,JSON.stringify(dados));
}
  
function limparFicha(){
  document.querySelectorAll("input, textarea").forEach(el=>{
    if(el.type !== "file"){
      el.value = "";
    }
  });

  // resetar nível
  document.getElementById("nivel").value = 1;

  // reset atributos
  atributos.forEach(a=>{
    const el = document.getElementById("atr_"+a.sigla);
    if(el) el.value = 0;
  });

  // reset perícias
  pericias.forEach((p,i)=>{
    const el = document.getElementById("per_"+i);
    if(el) el.value = 1;
  });

  // reset habilidades
  habilidades = [];
  renderHabilidades();

  // reset imagem
  const img = document.getElementById("previewImg");
  img.style.display="none";
  img.dataset.base64="";
  img.src="";

  recalcularVidaSanidade();
}
  
/* ================= CARREGAR ================= */
function carregarFicha(){
  const slot=document.getElementById("slot").value;
  const chave="fichaRPG_"+slot;
  const salvo=localStorage.getItem(chave);

if(!salvo){
  limparFicha();
  return;
}

  const d=JSON.parse(salvo);

  nome.value=d.nome||"";
  idade.value=d.idade||"";
  antecedencia.value=d.antecedencia||"";
  descricao.value=d.descricao||"";
  historia.value=d.historia||"";
  nivel.value=d.nivel||1;
  vida.value = d.vida || 0;
  sanidade.value = d.sanidade || 0;
  aura.value = d.aura || 0;
  const img = document.getElementById("previewImg");
if(d.imagem){
  img.src = d.imagem;
  img.style.display = "block";
  img.dataset.base64 = d.imagem;
}else{
  img.style.display = "none";
  img.dataset.base64 = "";
}

  for(const s in d.atributos){
    const el=document.getElementById("atr_"+s);
    if(el) el.value=d.atributos[s];
  }

  for(const p in d.pericias){
    const el=document.getElementById(p);
    if(el) el.value=d.pericias[p];
  }

  habilidades=d.habilidades||[];
  renderHabilidades();

  recalcularVidaSanidade();
  atualizarBloqueio();
}

/* ================= PDF ================= */
async function gerarPDF(){
  const { jsPDF }=window.jspdf;
  const ficha=document.getElementById("ficha");
  const canvas=await html2canvas(ficha,{scale:2});
  const img=canvas.toDataURL("image/png");

  const pdf=new jsPDF("p","mm","a4");
  const w=pdf.internal.pageSize.getWidth()-10;
  const h=(canvas.height*w)/canvas.width;

  pdf.addImage(img,"PNG",5,5,w,h);
  pdf.save("ficha_rpg.pdf");
}

let slotAtual = document.getElementById("slot").value;

document.getElementById("slot").addEventListener("change", function(){

  // salva no slot antigo
  const chaveAntiga = "fichaRPG_" + slotAtual;
  salvarFichaManual(chaveAntiga);

  // atualiza slot atual
  slotAtual = this.value;

  // carrega o novo
  carregarFicha();
});

  
/* ================= START ================= */
criarInterface();
carregarFicha();
</script>
