<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ficha RPG Interativa</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
  background:#0f172a;
  color:#e5e7eb;
  font-family: Arial, sans-serif;
}

.bloco{
  background:#1f2937;
  padding:18px;
  border-radius:14px;
  margin:18px auto;
  max-width:900px;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h2{
  margin-top:0;
  color:#a5b4fc;
  border-bottom:1px solid #374151;
  padding-bottom:6px;
}

.linha{
  margin:10px 0;
  display:flex;
  flex-direction:column;
}

input, select, textarea{
  border-radius:10px;
  border:1px solid #374151;
  padding:8px;
  background:#020617;
  color:#e5e7eb;
}

.atributo, .pericia, .habilidade{
  display:grid;
  grid-template-columns: 1fr 90px 40px 160px;
  align-items:center;
  gap:10px;
  margin:6px 0;
}

.dice{
  cursor:pointer;
  font-size:22px;
  text-align:center;
  transition: 0.2s;
}

.dice:hover{
  filter: drop-shadow(0 0 8px #facc15);
  transform: scale(1.2);
}

.resultado{
  color:#a5f3fc;
  font-size:13px;
}

.status-card{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr;
  gap:14px;
}

.status-item{
  background:#020617;
  border:1px solid #374151;
  padding:12px;
  border-radius:12px;
}

.status-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

.status-bar{
  height:8px;
  background:#1f2937;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
  cursor:pointer;
}

.status-fill{
  height:8px;
  background:linear-gradient(90deg,#4ade80,#22c55e);
  width:100%;
  transition:.25s;
}

.status-fill.sanity{
  background:linear-gradient(90deg,#60a5fa,#3b82f6);
}

.status-fill.aura{
  background:linear-gradient(90deg,#fde047,#facc15);
}

.alerta{
  margin-top:10px;
  padding:8px 10px;
  border-radius:10px;
  background:#065f46;
  border:1px solid #059669;
  color:#d1fae5;
  display:none;
}

.status-sub{
  background:#0f172a;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid #374151;
  font-size:14px;
}

.salvar-btn{
  margin-top:10px;
  padding:10px 20px;
  border-radius:10px;
  border:none;
  background:#4f46e5;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* ===== POPUP RESULTADO ===== */
.resultado-popup {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background:#1f2937;
  color:#e5e7eb;
  border:1px solid #4ade80;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
  z-index:9999;
  animation: popUp 0.3s ease;
  min-width:180px;
}

.resultado-popup .resultado-header {
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:5px;
}

.resultado-popup button{
  background:none;
  border:none;
  color:#f87171;
  cursor:pointer;
  font-weight:bold;
}

@keyframes popUp {
  from { transform: translateY(50px); opacity:0; }
  to { transform: translateY(0); opacity:1; }
}
</style>
</head>

<body>

<div id="ficha">

<!-- SLOT -->
<div class="bloco">
<h2>Seleção de Ficha</h2>
<div class="linha">
<label>Escolha o slot</label>
<select id="slot">
<option value="1">Slot 1</option>
<option value="2">Slot 2</option>
<option value="3">Slot 3</option>
<option value="4">Slot 4</option>
<option value="5">Slot 5</option>
<option value="6">Slot 6</option> 
<option value="7">Slot 7</option> 
<option value="8">Slot 8</option>
<option value="9">Slot 9</option> 
<option value="10">Slot 10</option> 
</select>
</div>
</div>

<!-- BÁSICO -->
<div class="bloco">
<h2>Informações Básicas</h2>
<div class="linha">
  <label>Imagem do Personagem</label>
  <input type="file" id="imgUpload" accept="image/*" onchange="carregarImagem(event)">
</div>

<div class="linha" style="text-align:center;">
  <img id="previewImg" 
       style="max-width:200px; max-height:200px; border-radius:12px; border:1px solid #374151; display:none;">
</div>
<div class="linha"><label>Nome</label><input id="nome"></div>
<div class="linha"><label>Idade</label><input id="idade" type="number"></div>
<div class="linha"><label>Energia Inata</label><textarea id="antecedencia"></textarea></div>
<div class="linha"><label>Descrição</label><textarea id="descricao"></textarea></div>
<div class="linha"><label>História</label><textarea id="historia"></textarea></div>
</div>

<!-- ATRIBUTOS -->
<div class="bloco">
<h2>Atributos</h2>

<div class="linha">
<label>Nível do Personagem</label>
<select id="nivel" onchange="recalcularVidaSanidade()">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
</select>
</div>

<div id="atributos"></div>
</div>

<!-- PERÍCIAS -->
<div class="bloco">
<h2>Perícias</h2>
<div id="pericias"></div>
</div>

<!-- STATUS -->
<div class="bloco">
<h2>Status</h2>
<div class="status-card">

<div class="status-item">
<div class="status-top"><div>Vida</div><span>❤️</span></div>
<input id="vida" type="number" oninput="atualizarVida()">
<small id="vidaMaxTxt"></small>
<div class="status-bar">
  <div id="vida-bar" class="status-fill"></div>
</div>
</div>

<div class="status-item">
<div class="status-top"><div>Sanidade</div><span>🧠</span></div>
<input id="sanidade" type="number" oninput="atualizarSanidade()">
<small id="sanidadeMaxTxt"></small>
<div class="status-bar">
  <div id="sanidade-bar" class="status-fill sanity"></div>
</div>
</div>

<div class="status-item">
<div class="status-top"><div>Aura ✨</div></div>
<input id="aura" type="number" value="0" oninput="atualizarAura()">
<small id="auraMaxTxt">Máx: 0</small>
<div class="status-bar">
  <div id="aura-bar" class="status-fill aura"></div>
</div>
</div>

<div class="status-item">
<div class="status-top"><div>Bloqueio 🛡</div></div>
<div style="display:flex; gap:10px; margin-bottom:6px;">
  <div class="status-sub">🔹 <strong>Menor:</strong> <span id="bloqueioMenor">0</span></div>
  <div class="status-sub">🔸 <strong>Maior:</strong> <span id="bloqueioMaior">0</span></div>
</div>
<div class="linha">
  <label>RD Total</label>
  <input type="number" id="rdTotal" value="0" oninput="atualizarBloqueio()">
</div>
</div>

<div class="status-item">
<div class="status-top"><div>Deslocamento (Quadrados)</div></div>
<input id="deslocamento" type="number" disabled>
</div>

</div>
</div>

<!-- HABILIDADES -->
<div class="bloco">
<h2>Habilidades</h2>
<div id="habilidades"></div>
<button class="salvar-btn" onclick="adicionarHabilidade()">+ Adicionar Habilidade</button>
</div>

<!-- SALVAR / PDF -->
<div class="bloco">
<button class="salvar-btn" onclick="salvarFicha()">Salvar ficha</button>
<div id="alerta" class="alerta">Ficha salva com sucesso!</div>
<button class="salvar-btn" onclick="gerarPDF()">Baixar PDF da ficha</button>
</div>

</div>

<script>
/* ================= DADOS ================= */
const atributos = [
{sigla:"FOR", nome:"Força"},
{sigla:"CON", nome:"Constituição"},
{sigla:"AGI", nome:"Agilidade"},
{sigla:"INT", nome:"Intelecto"},
{sigla:"POD", nome:"Poder"}
];

const pericias = [
["FOR","Atletismo"],["FOR","Luta"],
["CON","Fortitude"],
["AGI","Reflexos"],["AGI","Furtividade"],["AGI","Acrobacia"],
["AGI","Iniciativa"],["AGI","Pontaria"],["AGI","Pilotagem"],
["INT","Ciências"],["INT","Tática"],["INT","Investigação"],
["INT","Medicina"],["INT","Tecnologia"],["INT","Sobrevivência"],
["INT","Enganação"],["INT","Diplomacia"],["POD","Intimidação"],
["INT","Artes"],["POD","Intuição"],["INT","Percepção"],
["INT","Adestramento"],["POD","Charme"],["POD","Vontade"],["POD","Energia"]
];

let habilidades = [];
let ultimoTesteFortitude = 0;

/* ================= INTERFACE ================= */
function criarInterface(){
  const aBox = document.getElementById("atributos");
  aBox.innerHTML = "";

  atributos.forEach(a=>{
    aBox.innerHTML += `
    <div class="atributo">
      <div>[${a.sigla}] ${a.nome}</div>
      <select id="atr_${a.sigla}" onchange="recalcularVidaSanidade(); atualizarBloqueio();">
        ${[...Array(21).keys()].map(v=>`<option value="${v}">${v}</option>`).join("")}
      </select>
      <span class="dice" onclick="rolarAtributo('${a.sigla}')">🎲</span>
      <span id="resAtr_${a.sigla}" class="resultado"></span>
    </div>`;
  });

const pBox = document.getElementById("pericias");
pBox.innerHTML = "";
  
pericias.forEach((p,i)=>{
  const id = "per_"+i;

  pBox.innerHTML += `
  <div class="pericia">
    <div>
      <select id="atrKey_${id}">
        ${atributos.map(a=>`<option value="${a.sigla}" ${a.sigla===p[0]?"selected":""}>[${a.sigla}]</option>`).join("")}
      </select>
      ${p[1]}
    </div>

    <select id="${id}">
      ${[...Array(10).keys()].map(v=>`<option value="${v+1}">${v+1}</option>`).join("")}
    </select>

    <input type="number" id="bonus_${id}" value="0" style="width:60px">

    <span class="dice" onclick="rolarPericia('${id}')">🎲</span>
  </div>`;
});
}

/* ================= ROLAGENS ================= */
function d20(){ return Math.floor(Math.random()*20)+1; }

function tocarSomDado(){
  const audio = new Audio("dado.mp3"); // arquivo necessário na pasta
  audio.play();
}

function criarPopupResultado(titulo,texto){
  const div = document.createElement("div");
  div.className = "resultado-popup";
  div.innerHTML = `<div class="resultado-header">${titulo} <button onclick="this.parentElement.parentElement.remove()">❌</button></div>
                   <div class="resultado-body">${texto}</div>`;
  document.body.appendChild(div);
  setTimeout(()=>{ if(div.parentElement) div.remove(); },15000);
  tocarSomDado();
  return div;
}

function rolarAtributo(sigla){
  const v=Number(document.getElementById("atr_"+sigla).value);
  const d=d20();
  criarPopupResultado(`[${sigla}]`,`1d20 (${d}) + ${v} = ${d+v}`);
}

function rolarPericia(id){
  const qtdDados = parseInt(document.getElementById(id).value);
  const sigla = document.getElementById("atrKey_"+id).value;
  const bonus = parseInt(document.getElementById("bonus_"+id).value) || 0;
  const atributoValor = parseInt(document.getElementById("atr_"+sigla).value)||0;
  let resultados = [];
  let maior = 0;
  for(let i=0;i<qtdDados;i++){
    const r=d20(); resultados.push(r); if(r>maior)maior=r;
  }
  const total = maior + atributoValor + bonus;
  if(pericias[parseInt(id.split("_")[1])][1]==="Fortitude") ultimoTesteFortitude = total;
  criarPopupResultado(pericias[parseInt(id.split("_")[1])][1],`${qtdDados}d20 [${resultados.join(", ")}] → maior: ${maior} + ${atributoValor} + ${bonus} = ${total}`);
  atualizarBloqueio();
}

function rolarHabilidade(i){
  const h=habilidades[i];
  const regex=/(\d+)d(\d+)([+-]\d+)?/i;
  const match=h.dado.match(regex);
  if(!match){ criarPopupResultado("Erro","Formato inválido"); return; }
  const qtd=Number(match[1]);
  const faces=Number(match[2]);
  const mod=Number(match[3]||0);
  let rolls=[], total=0;
  for(let r=0;r<qtd;r++){ const v=Math.floor(Math.random()*faces)+1; rolls.push(v); total+=v;}
  total+=mod;
  criarPopupResultado(h.nome,`${qtd}d${faces} [${rolls.join(" + ")}] ${mod>=0?"+":""}${mod} = ${total}`);
}

/* ================= VIDA, SANIDADE, AURA, BLOQUEIO ================= */
function recalcularVidaSanidade(){
  const nivel = Number(document.getElementById("nivel").value) || 1;
  const con = Number(document.getElementById("atr_CON").value) || 0;
  const pod = Number(document.getElementById("atr_POD").value) || 0;
  const intt = Number(document.getElementById("atr_INT").value) || 0;
  const agi = Number(document.getElementById("atr_AGI").value) || 0;

  const vidaMax = (20 + con*2) * nivel;
  const sanMax = (20 + intt*2) * nivel;
  const auraMax = (con+pod)*3 + (con+pod)*(nivel-1);

  document.getElementById("vida").max = vidaMax;
  document.getElementById("vida").value = Math.min(document.getElementById("vida").value||vidaMax,vidaMax);
  document.getElementById("sanidade").max = sanMax;
  document.getElementById("sanidade").value = Math.min(document.getElementById("sanidade").value||sanMax,sanMax);
  document.getElementById("aura").max = auraMax;
  document.getElementById("aura").value = Math.min(document.getElementById("aura").value||auraMax,auraMax);
  document.getElementById("vidaMaxTxt").innerText="Máx: "+vidaMax;
  document.getElementById("sanidadeMaxTxt").innerText="Máx: "+sanMax;
  document.getElementById("auraMaxTxt").innerText="Máx: "+auraMax;

  atualizarBarra("vida","vida-bar",vidaMax);
  atualizarBarra("sanidade","sanidade-bar",sanMax);
  atualizarAura();

  // Atualiza deslocamento
  document.getElementById("deslocamento").value = 5 + agi;
}

function atualizarBarra(inputId,barId,max){
  const v=Number(document.getElementById(inputId).value)||0;
  document.getElementBy
    document.getElementById(barId).style.width = (v/max*100)+"%";
}

function atualizarVida(){
  const max=document.getElementById("vida").max;
  atualizarBarra("vida","vida-bar",max);
}

function atualizarSanidade(){
  const max=document.getElementById("sanidade").max;
  atualizarBarra("sanidade","sanidade-bar",max);
}

function atualizarAura(){
  const max=document.getElementById("aura").max;
  atualizarBarra("aura","aura-bar",max);
}

function atualizarBloqueio(){
  const rd = Number(document.getElementById("rdTotal").value) || 0;

  const bloqueioMenor = rd + ultimoTesteFortitude;
  const bloqueioMaior = rd + (ultimoTesteFortitude*2);

  document.getElementById("bloqueioMenor").innerText = bloqueioMenor;
  document.getElementById("bloqueioMaior").innerText = bloqueioMaior;
}

/* ================= HABILIDADES ================= */

function adicionarHabilidade(){
  habilidades.push({nome:"", descricao:"", dado:"1d6"});
  renderizarHabilidades();
}

function renderizarHabilidades(){
  const box=document.getElementById("habilidades");
  box.innerHTML="";

  habilidades.forEach((h,i)=>{
    box.innerHTML += `
    <div class="habilidade">
      <input placeholder="Nome" value="${h.nome}" 
      onchange="habilidades[${i}].nome=this.value">

      <textarea placeholder="Descrição"
      onchange="habilidades[${i}].descricao=this.value">${h.descricao}</textarea>

      <input placeholder="Dado (ex: 2d6+3)" value="${h.dado}"
      onchange="habilidades[${i}].dado=this.value">

      <span class="dice" onclick="rolarHabilidade(${i})">🎲</span>
    </div>`;
  });
}

/* ================= IMAGEM ================= */

function carregarImagem(event){
  const reader = new FileReader();
  reader.onload = function(){
    const img = document.getElementById("previewImg");
    img.src = reader.result;
    img.style.display="block";
  }
  reader.readAsDataURL(event.target.files[0]);
}

/* ================= SALVAR ================= */

function salvarFicha(){

  const slot = document.getElementById("slot").value;

  const dados={
    nome:document.getElementById("nome").value,
    idade:document.getElementById("idade").value,
    antecedentes:document.getElementById("antecedencia").value,
    descricao:document.getElementById("descricao").value,
    historia:document.getElementById("historia").value,

    nivel:document.getElementById("nivel").value,

    atributos:{},
    vida:document.getElementById("vida").value,
    sanidade:document.getElementById("sanidade").value,
    aura:document.getElementById("aura").value,

    habilidades:habilidades
  };

  atributos.forEach(a=>{
    dados.atributos[a.sigla] =
    document.getElementById("atr_"+a.sigla).value;
  });

  localStorage.setItem("ficha_"+slot,JSON.stringify(dados));

  const alerta=document.getElementById("alerta");
  alerta.style.display="block";
  setTimeout(()=>alerta.style.display="none",2000);
}

/* ================= CARREGAR ================= */

document.getElementById("slot").addEventListener("change",carregarFicha);

function carregarFicha(){

  const slot=document.getElementById("slot").value;
  const dados=JSON.parse(localStorage.getItem("ficha_"+slot));

  if(!dados) return;

  document.getElementById("nome").value=dados.nome||"";
  document.getElementById("idade").value=dados.idade||"";
  document.getElementById("antecedencia").value=dados.antecedentes||"";
  document.getElementById("descricao").value=dados.descricao||"";
  document.getElementById("historia").value=dados.historia||"";

  document.getElementById("nivel").value=dados.nivel||1;

  atributos.forEach(a=>{
    document.getElementById("atr_"+a.sigla).value =
    dados.atributos?.[a.sigla]||0;
  });

  document.getElementById("vida").value=dados.vida||0;
  document.getElementById("sanidade").value=dados.sanidade||0;
  document.getElementById("aura").value=dados.aura||0;

  habilidades=dados.habilidades||[];

  renderizarHabilidades();
  recalcularVidaSanidade();
}

/* ================= PDF ================= */

async function gerarPDF(){

  const ficha=document.getElementById("ficha");

  const canvas = await html2canvas(ficha,{scale:2});

  const imgData = canvas.toDataURL("image/png");

  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF("p","mm","a4");

  const largura=210;
  const altura = canvas.height * largura / canvas.width;

  pdf.addImage(imgData,"PNG",0,0,largura,altura);

  pdf.save("ficha_rpg.pdf");
}

/* ================= INIT ================= */

criarInterface();
recalcularVidaSanidade();
renderizarHabilidades();

</script>

</body>
</html>
