<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ficha RPG</title>

<style>

.tabs{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}

.tabs button{
  padding:12px 22px;
  border:none;
  border-radius:12px;
  background:#1f2937;
  color:#e5e7eb;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  letter-spacing:0.5px;

  transition:0.25s;
}

.tabs button:hover{
  background:#374151;
  transform:translateY(-2px);
}

.tabs button.ativa{
  background:linear-gradient(135deg,#6366f1,#4f46e5);
  box-shadow:0 0 15px rgba(99,102,241,0.6);
  transform:scale(1.05);
}
  
.aba{
  display:none;
}

.aba.ativa{
  display:block;
}
  
.dice-popup{
  position:fixed;
  bottom:20px;
  right:20px;

  width:260px;
  padding:14px;

  background:#111827;
  border:2px solid #facc15;
  border-radius:10px;

  box-shadow:0 0 20px rgba(0,0,0,0.6);

  z-index:9999;
}

.dice-popup-header{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:16px;
  margin-bottom:8px;
}

.popup-close{
  cursor:pointer;
}

.popup-close:hover{
  color:#f87171;
}

.dice-popup-body{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

#popupDetalhe{
  font-size:13px;
  color:#d1d5db;
}

#popupTotal{
  font-size:26px;
  font-weight:bold;
  color:#facc15;
}
  
body{
  background:#0f172a;
  color:#e5e7eb;
  font-family: Arial, sans-serif;
  font-size:16px; 
}

.bloco{
  background:#1f2937;
  padding:18px;
  border-radius:14px;
  margin:18px auto;
  max-width:900px;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h2{
  margin-top:0;
  color:#a5b4fc;
  border-bottom:1px solid #374151;
  padding-bottom:6px;
  font-size:22px;
}

.linha{
  margin:10px 0;
  display:flex;
  flex-direction:column;
}

input, select, textarea{
  border-radius:10px;
  border:1px solid #374151;
  padding:8px;
  background:#020617;
  color:#e5e7eb;
}

input:focus, textarea:focus, select:focus{
  outline:none;
  border:1px solid #6366f1;
  box-shadow:0 0 5px #6366f1;
}

.atributo, .pericia{
  display:grid;
  grid-template-columns: 1fr 90px 40px 160px;
  align-items:center;
  gap:10px;
  margin:6px 0;
}

.dice{
  cursor:pointer;
  font-size:22px;
  text-align:center;
}

.dice:hover {
  filter: drop-shadow(0 0 8px #facc15);
  transform: scale(1.2);
  transition: 0.2s;
}

#logRolagens{
  max-height:300px;
  overflow-y:auto;
  display:flex;
  flex-direction:column-reverse;
  gap:6px;
}

.log-item{
  background:#020617;
  border:1px solid #374151;
  padding:8px;
  border-radius:8px;
  font-size:13px;
}

.log-nome{
  color:#a5b4fc;
  font-weight:bold;
}

.log-valor{
  color:#facc15;
}

.resultado{
  color:#a5f3fc;
  font-size:13px;
}

.resultado-popup {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background:#1f2937;
  color:#e5e7eb;
  border:1px solid #4ade80;
  border-radius:8px;
  padding:10px;
  margin-top:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
  z-index:9999;
  animation: popUp 0.3s ease;
}
.resultado-popup .resultado-header {
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:5px;
}
@keyframes popUp {
  from { transform: translateY(50px); opacity:0; }
  to { transform: translateY(0); opacity:1; }
}

.status-card{
  display:grid;
  grid-template-columns: 1fr 1fr;
  grid-template-areas:
    "vida sanidade"
    "aura deslocamento"
    "dt bloqueio";
  gap:14px;
}

.vida { grid-area: vida; }
.sanidade { grid-area: sanidade; }
.aura { grid-area: aura; }
.deslocamento { grid-area: deslocamento; }
.dt { grid-area: dt; }
.bloqueio { grid-area: bloqueio; }

.status-item{
  background:#020617;
  border:1px solid #374151;
  padding:12px;
  border-radius:12px;
  transition: 0.2s;
}

.status-item:hover{
  transform: translateY(-3px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.status-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:6px;
}

.status-top div{
  font-weight:600;
  font-size:15px;
}

.status-bar{
  height:8px;
  background:#1f2937;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
  cursor:pointer;
}

.status-fill{
  height:8px;
  background:linear-gradient(90deg,#4ade80,#22c55e);
  width:100%;
  transition: width 0.4s ease;
}

.status-fill.sanity{
  background:linear-gradient(90deg,#60a5fa,#3b82f6);
}

.status-fill.aura{
  background:linear-gradient(90deg,#fde047,#facc15);
}

.alerta{
  margin-top:10px;
  padding:8px 10px;
  border-radius:10px;
  background:#065f46;
  border:1px solid #059669;
  color:#d1fae5;
  display:none;
}
  .status-sub{
  background:#0f172a;
  padding:6px 10px;
  border-radius:8px;
  border:1px solid #374151;
  font-size:14px;
}

.salvar-btn{
  margin-top:10px;
  padding:10px 20px;
  border-radius:10px;
  border:none;
  background:#4f46e5;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.floating-menu{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;

  display:flex;
  flex-direction:column;
  gap:8px;
}

.floating-menu button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#4f46e5;
  color:white;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
  transition:0.2s;
}

.floating-menu button:hover{
  transform:scale(1.05);
  background:#6366f1;
}

.floating-menu .alerta{
  display:none;
  font-size:12px;
  padding:6px;
}

.floating-log{
  position:fixed;
  top:20px;
  left:20px;
  width:280px;
  max-height:400px;
  background:#111827;
  border:2px solid #60a5fa;
  border-radius:12px;
  padding:10px;
  z-index:9999;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
  display:flex;
  flex-direction:column;
}

.log-header{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  margin-bottom:8px;
}

.floating-log #logRolagens{
  overflow-y:auto;
  display:flex;
  flex-direction:column-reverse;
  gap:6px;
}

#codigoFicha{
  width:220px;
  height:80px;
  border-radius:10px;
  border:1px solid #374151;
  background:#020617;
  color:#e5e7eb;
  padding:6px;
}

.habilidade{
  display:flex;
  flex-direction:column;
  background:#020617;
  padding:10px;
  border-radius:10px;
  border:1px solid #374151;
}

.habilidade textarea{
  grid-column: 1 / -1; /* ocupa linha inteira */
}

.habilidade input{
  margin-bottom:6px;
}

.habilidade textarea{
  margin-top:6px;
}
  
</style>
</head>

<script>
  const firebaseConfig = {

  };

  const app = firebase.initializeApp(firebaseConfig);

  const database = firebase.database();

  let logRolagens = [];
  const rolagensRef = database.ref('rolagens').limitToLast(20);
  rolagensRef.on('child_added', (snapshot) => {

    logRolagens.push(novaRolagem);

<script>

function trocarAba(nome, el){
  document.querySelectorAll(".aba").forEach(a=>{
    a.classList.remove("ativa");
  });

  document.querySelectorAll(".tabs button").forEach(b=>{
    b.classList.remove("ativa");
  });

  document.getElementById("aba_"+nome).classList.add("ativa");

  el.classList.add("ativa"); 
}

let logVisivel = true;

function registrarLog(tipo, detalhe, total){
  const nome = document.getElementById("jogador").value || "Anônimo";

  const log = {
    nome,
    tipo,
    detalhe,
    total,
    hora: new Date().toLocaleString('pt-BR') // Formato local da data/hora
  };

  database.ref('rolagens').push(log)
    .then(() => {
      console.log("Log de rolagem enviado para o Firebase!");
    })
    .catch((error) => {
      console.error("Erro ao enviar log para o Firebase: ", error);
    });
}
  
function atualizarLog(){
  const box = document.getElementById("logRolagens");
  box.innerHTML = "";

  // Mostra os últimos 20 logs, do mais recente para o mais antigo
  logRolagens.slice().reverse().forEach(l => { // .slice() para criar uma cópia e não inverter o original
    box.innerHTML += `
      <div class="log-item">
        <span class="log-nome">${l.nome}</span>
        → ${l.tipo} <br>
        ${l.detalhe} = <span class="log-valor">${l.total}</span>
        <div style="font-size:11px; opacity:0.6">${l.hora}</div>
      </div>
    `;
  });
}

function mostrarPopup(titulo, detalhe, total){

  const popup = document.getElementById("dicePopup");

  document.getElementById("popupTitulo").innerText = titulo;
  document.getElementById("popupDetalhe").innerText = detalhe;
  document.getElementById("popupTotal").innerText = total;

  popup.style.display = "block";
}

function fecharPopup(){
  document.getElementById("dicePopup").style.display = "none";
}

function toggleLogFloating(){
  const log = document.getElementById("logFloating");

  if(log.style.display === "none"){
    log.style.display = "flex";
  } else {
    log.style.display = "none";
  }
}

function exportarFicha(){
  const slot = document.getElementById("slot").value;
  const chave = "fichaRPG_" + slot;

  const bruto = localStorage.getItem(chave);

  if(!bruto){
    alert("Nenhuma ficha salva nesse slot!");
    return;
  }

  const dados = JSON.parse(bruto);

  // remove imagem
  dados.imagem = "";

  const codigo = btoa(JSON.stringify(dados));

  document.getElementById("codigoFicha").value = codigo;

  alert("Ficha exportada!");
}

function importarFicha(){
  const codigo = document.getElementById("codigoFicha").value;

  if(!codigo){
    alert("Cole um código válido!");
    return;
  }

  try{
    const dados = JSON.parse(atob(codigo)); // ✅ AQUI está o fix

    const slot = document.getElementById("slot").value;
    const chave = "fichaRPG_" + slot;

    localStorage.setItem(chave, JSON.stringify(dados));

    carregarFicha();

    alert("Ficha importada com sucesso!");
  }catch(e){
    console.error(e);
    alert("Código inválido!");
  }
}
  
/* ================= DADOS ================= */  
const somDado = new Audio("dado.mp3")
  
const atributos = [
{sigla:"FOR", nome:"Força"},
{sigla:"CON", nome:"Constituição"},
{sigla:"AGI", nome:"Agilidade"},
{sigla:"INT", nome:"Intelecto"},
{sigla:"POD", nome:"Poder"}
];

const pericias = [
["FOR","Atletismo"],["FOR","Luta"],
["CON","Fortitude"],
["AGI","Reflexos"],["AGI","Furtividade"],["AGI","Acrobacia"],
["AGI","Iniciativa"],["AGI","Pontaria"],["AGI","Pilotagem"],
["INT","Ciências"],["INT","Tática"],["INT","Investigação"],
["INT","Medicina"],["INT","Tecnologia"],["INT","Sobrevivência"],
["INT","Enganação"],["INT","Diplomacia"],["POD","Intimidação"],
["INT","Artes"],["POD","Intuição"],["INT","Percepção"],
["INT","Adestramento"],["POD","Charme"],["POD","Vontade"],["POD","Energia"]
];

let ultimoTesteFortitude = 0;

/* ================= INTERFACE ================= */
function criarInterface(){
  const aBox = document.getElementById("atributos");
  aBox.innerHTML = "";

  atributos.forEach(a=>{
    aBox.innerHTML += `
    <div class="atributo">
      <div>[${a.sigla}] ${a.nome}</div>
      <select id="atr_${a.sigla}" onchange="recalcularVidaSanidade(); atualizarBloqueio(); atualizarDT();">
        ${[...Array(21).keys()].map(v=>`<option value="${v}">${v}</option>`).join("")}
      </select>
      <span class="dice" onclick="rolarAtributo('${a.sigla}')">🎲</span>
      <span id="resAtr_${a.sigla}" class="resultado"></span>
    </div>`;
  });

const pBox = document.getElementById("pericias");
pBox.innerHTML = "";
  
pericias.forEach((p,i)=>{
  const id = "per_"+i;

  pBox.innerHTML += `
  <div class="pericia">
    <div>
      <select id="atrKey_${id}">
        ${atributos.map(a=>`<option value="${a.sigla}" ${a.sigla===p[0]?"selected":""}>[${a.sigla}]</option>`).join("")}
      </select>
      ${p[1]}
    </div>

    <select id="${id}">
      ${[...Array(10).keys()].map(v=>`<option value="${v+1}">${v+1}</option>`).join("")}
    </select>

    <input type="number" id="bonus_${id}" value="0" style="width:60px">

    <span class="dice" onclick="rolarPericia('${id}')">🎲</span>
    <span id="res_${id}" class="resultado"></span>
  </div>`;
});
}

/* ================= ROLAGENS ================= */
  
function d20(){

  somDado.currentTime = 0;
  somDado.play();

  return Math.floor(Math.random()*20)+1;

}

function limparDepois(id,ms=8000){
  setTimeout(()=>{
    const el=document.getElementById(id);
    if(el) el.innerText="";
  },ms);
}

function rolarAtributo(sigla){
  
  const v=Number(document.getElementById("atr_"+sigla).value);
  const resId="resAtr_"+sigla;
  const d=d20();
  document.getElementById(resId).innerText=`1d20 (${d}) + ${v} = ${d+v}`;
  const total = d + v;
document.getElementById(resId).innerText =
`1d20 (${d}) + ${v} = ${total}`;

mostrarPopup(
  sigla,
  `1d20 (${d}) + ${v}`,
  total
  );

registrarLog(sigla, `1d20 (${d}) + ${v}`, total);;
  
  limparDepois(resId);
}

function rolarPericia(id){
  
  const qtdDados = parseInt(document.getElementById(id).value);
  const sigla = document.getElementById("atrKey_"+id).value;
  const bonus = parseInt(document.getElementById("bonus_"+id).value) || 0;

  const atributoValor = parseInt(
    document.getElementById("atr_"+sigla).value
  ) || 0;

  let resultados = [];
  let maior = 0;

  for(let i = 0; i < qtdDados; i++){
    const roll = d20();
    resultados.push(roll);
    if(roll > maior) maior = roll;
  }

const total = maior + atributoValor + bonus;

const indice = parseInt(id.split("_")[1]);

mostrarPopup(
  pericias[indice][1],
  `${qtdDados}d20 [${resultados.join(", ")}]`,
  total
);

registrarLog(pericias[indice][1], `${qtdDados}d20 [${resultados.join(", ")}] + ${atributoValor} + ${bonus}`, total);

const resId = "res_" + id;

document.getElementById(resId).innerText =
`🎲 ${qtdDados}d20 [${resultados.join(", ")}] → maior: ${maior} + ${atributoValor} + ${bonus} = ${total}`;
  if(pericias[indice][1] === "Fortitude"){
    ultimoTesteFortitude = total;
    atualizarBloqueio();
  }
  
  limparDepois(resId);
}

/* ================= VIDA, SANIDADE & AURA ================= */
function recalcularVidaSanidade(){
  const nivel = Number(document.getElementById("nivel").value) || 1;

  const con = Number(document.getElementById("atr_CON").value) || 0;
  const pod = Number(document.getElementById("atr_POD").value) || 0;
  const intt = Number(document.getElementById("atr_INT").value) || 0;

  const vidaMax = (20 + con * 2) * nivel;

  const sanidadeMax = (20 + intt * 2) * nivel;

  const auraBase = (con + pod) * 3;
  const auraNivel = (con + pod) * (nivel - 1);
  const auraMax = auraBase + auraNivel;

  const vidaInput = document.getElementById("vida");
  const sanidadeInput = document.getElementById("sanidade");
  const auraInput = document.getElementById("aura");

  vidaInput.max = vidaMax;
  sanidadeInput.max = sanidadeMax;
  auraInput.max = auraMax;

  if(!vidaInput.value || vidaInput.value > vidaMax){
    vidaInput.value = vidaMax;
  }

  if(!sanidadeInput.value || sanidadeInput.value > sanidadeMax){
    sanidadeInput.value = sanidadeMax;
  }

  if(!auraInput.value || auraInput.value > auraMax){
    auraInput.value = auraMax;
  }

  document.getElementById("vidaMaxTxt").innerText = "Máx: " + vidaMax;
  document.getElementById("sanidadeMaxTxt").innerText = "Máx: " + sanidadeMax;
  document.getElementById("auraMaxTxt").innerText = "Máx: " + auraMax;
  document.getElementById("deslocamento").value = 5 + Number(document.getElementById("atr_AGI").value || 0);

  atualizarBarra("vida","vida-bar",vidaMax);
  atualizarBarra("sanidade","sanidade-bar",sanidadeMax);
  atualizarAura();
}

function atualizarBarra(inputId,barId,max){
  const v = Number(document.getElementById(inputId).value) || 0;
  document.getElementById(barId).style.width =
    max > 0 ? ((v / max) * 100) + "%" : "0%";
}

function atualizarAura(){
  const auraEl = document.getElementById("aura");
  const max = Number(auraEl.getAttribute("max")) || 0;

  let v = Number(auraEl.value) || 0;

  if(v > max) v = max;
  if(v < 0) v = 0;

  auraEl.value = v;

  document.getElementById("aura-bar").style.width =
    max > 0 ? ((v / max) * 100) + "%" : "0%";
}

  function atualizarVida(){
  const max = Number(document.getElementById("vida").max) || 0;
  let v = Number(document.getElementById("vida").value) || 0;

  if(v > max) v = max;
  if(v < 0) v = 0;

  document.getElementById("vida").value = v;
  atualizarBarra("vida","vida-bar",max);
}

function atualizarSanidade(){
  const max = Number(document.getElementById("sanidade").max) || 0;
  let v = Number(document.getElementById("sanidade").value) || 0;

  if(v > max) v = max;
  if(v < 0) v = 0;

  document.getElementById("sanidade").value = v;
  atualizarBarra("sanidade","sanidade-bar",max);
}

function atualizarBloqueio(){

  const con = parseInt(document.getElementById("atr_CON").value) || 0;
  const rd = parseInt(document.getElementById("rdFisica").value) || 0;

  const bloqueioMenor = (2 * con) + rd;

  const bloqueioMaior = ultimoTesteFortitude + (2 * con) + rd;

  document.getElementById("bloqueioMenor").innerText = bloqueioMenor;
  document.getElementById("bloqueioMaior").innerText = bloqueioMaior;
}

function atualizarDT(){
  const poder = parseInt(document.getElementById("atr_POD").value) || 0;
  const intelecto = parseInt(document.getElementById("atr_INT").value) || 0;
  const bonus = parseInt(document.getElementById("dtBonus").value) || 0;

  const dt = 15 + poder + intelecto + bonus;

  document.getElementById("dtTotal").innerText = dt;
}
  
/* ================= HABILIDADES ================= */

function criarNovaHabilidade(){

  const box = document.getElementById("habilidadesLista");

  const id = Date.now();

  const habilidade = document.createElement("div");
  habilidade.className = "habilidade";
  habilidade.dataset.id = id;

  habilidade.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <input placeholder="Nome da técnica" class="hab-nome">

      <span style="cursor:pointer; color:#f87171; font-weight:bold;"
            onclick="this.parentElement.parentElement.remove()">✖</span>
    </div>

    <input placeholder="Dano (ex: 2d6+3, 5d8!7)" class="hab-dado">

    <textarea placeholder="Descrição da técnica" class="hab-desc"></textarea>
  `;

  box.appendChild(habilidade);
}

function coletarHabilidades(){
  const habilidades = [];

  document.querySelectorAll("#habilidadesLista .habilidade").forEach(h => {
    habilidades.push({
      nome: h.querySelector(".hab-nome").value,
      dado: h.querySelector(".hab-dado").value,
      desc: h.querySelector(".hab-desc").value
    });
  });

  return habilidades;
}

/* ================= SALVAR ================= */

function carregarImagem(event){
  const file = event.target.files[0];
  if(!file) return;

  // 🔴 Limite de 1MB
  if(file.size > 1024 * 1024){
    alert("Imagem muito grande! Use uma imagem menor que 1MB.");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e){
    const img = document.getElementById("previewImg");
    img.src = e.target.result;
    img.style.display = "block";
    img.dataset.base64 = e.target.result;
  };
  reader.readAsDataURL(file);
}
  
function salvarFicha(){
  const slot=document.getElementById("slot").value;
  const chave="fichaRPG_"+slot;

  const dados={
    imagem: document.getElementById("previewImg").dataset.base64 || "",
    nome:nome.value,
    idade:idade.value,
    antecedencia:antecedencia.value,
    descricao:descricao.value,
    historia:historia.value,
    nivel:nivel.value,
    vida:vida.value,
    sanidade:sanidade.value,
    aura:aura.value,
    atributos:{},
    pericias:{},
    habilidades: coletarHabilidades(),
    rdFisica: document.getElementById("rdFisica").value,
    rdMental: document.getElementById("rdMental").value,
    dtBonus: document.getElementById("dtBonus").value,
  };

  atributos.forEach(a=>{
    dados.atributos[a.sigla]=document.getElementById("atr_"+a.sigla).value;
  });

pericias.forEach((p,i)=>{
  const id = "per_" + i;

  dados.pericias[id] = {
    valor: document.getElementById(id).value,
    bonus: document.getElementById("bonus_" + id).value,
    atributo: document.getElementById("atrKey_" + id).value
  };
});

  localStorage.setItem(chave,JSON.stringify(dados));

  const alerta=document.getElementById("alerta");
  alerta.style.display="block";
  setTimeout(()=>alerta.style.display="none",2500);
}

function salvarFichaManual(chave){

  const dados={
    imagem: document.getElementById("previewImg").dataset.base64 || "",

function limparFicha(){
  document.querySelectorAll("input, textarea").forEach(el=>{
    if(el.type !== "file"){
      el.value = "";
    }
  });

  document.getElementById("rdFisica").value = 0;
  document.getElementById("rdMental").value = 0;
  
  // resetar nível
  document.getElementById("nivel").value = 1;

  // reset atributos
  atributos.forEach(a=>{
    const el = document.getElementById("atr_"+a.sigla);
    if(el) el.value = 0;
  });

  // reset perícias
  pericias.forEach((p,i)=>{
    const el = document.getElementById("per_"+i);
    if(el) el.value = 1;
  });

  // reset imagem
  const img = document.getElementById("previewImg");
  img.style.display="none";
  img.dataset.base64="";
  img.src="";

  recalcularVidaSanidade();
}
  
/* ================= CARREGAR ================= */
function carregarFicha(){
  const slot=document.getElementById("slot").value;
  const chave="fichaRPG_"+slot;
  const salvo=localStorage.getItem(chave);

if(!salvo){
  limparFicha();
  return;
}

  const d=JSON.parse(salvo);

  nome.value=d.nome||"";
  idade.value=d.idade||"";
  antecedencia.value=d.antecedencia||"";
  descricao.value=d.descricao||"";
  historia.value=d.historia||"";
  nivel.value=d.nivel||1;
  vida.value = d.vida || 0;
  sanidade.value = d.sanidade || 0;
  aura.value = d.aura || 0;
  const box = document.getElementById("habilidadesLista");
  box.innerHTML = "";

  (d.habilidades || []).forEach(h => {
  criarNovaHabilidade();

  const ultima = box.lastElementChild;

  ultima.querySelector(".hab-nome").value = h.nome || "";
  ultima.querySelector(".hab-dado").value = h.dado || "";
  ultima.querySelector(".hab-desc").value = h.desc || "";
});
  document.getElementById("rdFisica").value = d.rdFisica || 0;
  document.getElementById("rdMental").value = d.rdMental || 0;
  document.getElementById("dtBonus").value = d.dtBonus || 0;
  const img = document.getElementById("previewImg");
if(d.imagem){
  img.src = d.imagem;
  img.style.display = "block";
  img.dataset.base64 = d.imagem;
}else{
  img.style.display = "none";
  img.dataset.base64 = "";
}

  for(const s in d.atributos){
    const el=document.getElementById("atr_"+s);
    if(el) el.value=d.atributos[s];
  }

for(const p in d.pericias){
  const data = d.pericias[p];

  if(typeof data === "object"){
    if(document.getElementById(p))
      document.getElementById(p).value = data.valor || 1;

    if(document.getElementById("bonus_"+p))
      document.getElementById("bonus_"+p).value = data.bonus || 0;

    if(document.getElementById("atrKey_"+p))
      document.getElementById("atrKey_"+p).value = data.atributo || "FOR";
  } else {
    document.getElementById(p).value = data;
  }
}

  atualizarDT();

  recalcularVidaSanidade();
  atualizarBloqueio();
}

window.onload = () => {

  criarInterface();
  trocarAba("basico", document.querySelector(".tabs button"));
  carregarFicha();
  
  let slotAtual = document.getElementById("slot").value;

  document.getElementById("slot").addEventListener("change", function(){
    salvarFicha();
    slotAtual = this.value;
    carregarFicha();
  });

};
